<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CRi1 Music Learner</title>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; padding-top: 80px; height: 100vh; background: #fff; overflow: hidden; font-family: sans-serif; touch-action: none; }
        
        #staff-canvas { 
            position: relative; margin: 0 auto; width: 90%; height: 122px; 
            background-image: repeating-linear-gradient(to bottom, #000, #000 2px, transparent 2px, transparent 30px);
        }
        #note-head { position: absolute; left: 45%; font-size: 25px; transition: top 0.1s; transform: translate(-50%, -50%); }

        #controls { margin-top: 50px; display: flex; align-items: center; justify-content: center; gap: 20px; }
        .clef-lit { font-weight: bold; font-size: 24px; color: #000; }
        .clef-unlit { font-weight: bold; font-size: 24px; color: #ccc; }
        #d-pad { display: grid; grid-template-columns: repeat(3, 50px); gap: 5px; }
        button { height: 50px; border-radius: 8px; border: 1px solid #333; background: #eee; }

        #keyboard { position: absolute; bottom: 0; width: 100%; height: 80px; display: flex; border-top: 2px solid #000; }
        .key { flex: 1; border: 1px solid #000; background: #fff; }
    </style>
</head>
<body>

    <div id="staff-canvas"><div id="note-head">●</div></div>

    <div id="controls">
        <div id="clef-b" class="clef-unlit">B</div>
        <div id="d-pad">
            <div></div><button data-dir="up">^</button><div></div>
            <button data-dir="left"><</button><div id="note-label">C4</div><button data-dir="right">></button>
            <div></div><button data-dir="down">v</button><div></div>
        </div>
        <div id="clef-t" class="clef-lit">T</div>
    </div>

    <div id="keyboard"></div>

    <script>
        // Mapping: [Note, TopPosition (px)]
        // Middle C4 is at index 12 (one line below staff = 120px)
        const scale = [
            {name: "C4", top: 120}, {name: "D4", top: 105}, {name: "E4", top: 90}, {name: "F4", top: 75}, 
            {name: "G4", top: 60}, {name: "A4", top: 45}, {name: "B4", top: 30}, {name: "C5", top: 15}, 
            {name: "D5", top: 0}, {name: "E5", top: -15}, {name: "F5", top: -30}, {name: "G5", top: -45}, {name: "A5", top: -60}
        ];
        let idx = 0; 
        
        function update() {
            document.getElementById('note-label').textContent = scale[idx].name;
            document.getElementById('note-head').style.top = scale[idx].top + 'px';
            document.querySelectorAll('.key').forEach((el, i) => {
                el.style.backgroundColor = (i === idx) ? '#0000FF' : '#fff';
            });
        }

        document.querySelectorAll('button').forEach(b => {
            b.addEventListener('pointerdown', (e) => {
                const dir = e.target.dataset.dir;
                if(dir === 'up') idx = Math.min(idx + 1, scale.length - 1);
                if(dir === 'down') idx = Math.max(idx - 1, 0);
                update();
            });
        });
        update();
    </script>
</body>
</html>
