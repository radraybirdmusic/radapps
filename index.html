<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TRUMPET GARDEN v2.22</title>
    <style>
        :root { --p: #9d00ff; --g: #0f0; }
        body { margin: 0; background: #000; color: #fff; overflow: hidden; touch-action: none; width: 100vw; height: 100vh; }
        
        /* THE GATE: This MUST cover everything until clicked */
        #gate { 
            position: fixed; 
            inset: 0; 
            background: #000; 
            z-index: 9999; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
        }
        
        /* THE UI: This MUST stay hidden */
        #ui { 
            display: none; 
            position: relative; 
            width: 100vw; 
            height: 100vh; 
            z-index: 100;
        }

        #ignite-btn { 
            padding: 40px 80px; 
            font-size: 28px; 
            background: #111; 
            border: 4px solid var(--g); 
            color: var(--g); 
            font-weight: bold; 
            border-radius: 20px;
            cursor: pointer;
        }

        #header { 
            position: absolute; 
            top: 0; 
            width: 100%; 
            height: 130px; 
            background: #111; 
            border-bottom: 3px solid #333; 
        }
    </style>
</head>
<body>

<div id="gate">
    <button id="ignite-btn" onclick="ignite()">IGNITE v2.22</button>
</div>

<div id="ui">
    <div id="header">
        <div style="text-align:center; padding-top:50px; color:var(--g); font-weight:bold;">
            SYSTEM ACTIVE - STAGE 1
        </div>
    </div>
</div>

<script>
function ignite() {
    console.log("Igniting...");
    document.getElementById('gate').style.setProperty('display', 'none', 'important');
    document.getElementById('ui').style.setProperty('display', 'block', 'important');
}
</script>
</body>
</html>
