<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CRi1 Music Learner</title>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; height: 100vh; background: #fff; overflow: hidden; font-family: sans-serif; touch-action: none; }
        
        /* Staff Area: Exactly 5 lines drawn */
        #staff-canvas { 
            position: absolute !important; top: 100px !important; left: 5% !important; 
            width: 90% !important; height: 120px !important; 
            background-image: repeating-linear-gradient(to bottom, #000, #000 2px, transparent 2px, transparent 28px);
            background-position: 0 0; 
        }
        #note-head { 
            position: absolute; left: 45%; font-size: 20px; transition: top 0.1s; 
            transform: translate(-50%, -50%);
        }

        /* Controls Layout */
        #controls { position: absolute; top: 260px; width: 100%; display: flex; align-items: center; justify-content: center; gap: 15px; }
        #d-pad { display: grid; grid-template-columns: repeat(3, 50px); gap: 5px; }
        #note-label { font-size: 20px; font-weight: bold; text-align: center; }
        button { height: 50px; border-radius: 8px; border: 1px solid #333; background: #eee; }

        /* Keyboard */
        #keyboard { position: absolute; bottom: 0; width: 100%; height: 80px; display: flex; border-top: 3px solid #000; }
        .key { flex: 1; border: 1px solid #000; background: #fff; }
    </style>
</head>
<body>

    <div id="staff-canvas"><div id="note-head">●</div></div>

    <div id="controls">
        <div style="font-weight:bold; font-size: 24px;">B</div>
        <div id="d-pad">
            <div></div><button data-dir="up">^</button><div></div>
            <button data-dir="left"><</button><div id="note-label">C4</div><button data-dir="right">></button>
            <div></div><button data-dir="down">v</button><div></div>
        </div>
        <div style="font-weight:bold; font-size: 24px;">T</div>
    </div>

    <div id="keyboard"></div>

    <script>
        // C4 = 60. Using C major scale for white keys.
        let pitch = 60; 
        const whiteKeys = [60, 62, 64, 65, 67, 69, 71, 72, 74, 76, 77, 79, 81, 83, 84]; 
        const chakraColors = ["#FF0000", "#FF7F00", "#FFFF00", "#00FF00", "#0000FF", "#4B0082", "#9400D3"];
        
        const kb = document.getElementById('keyboard');
        for(let i = 0; i < 15; i++) {
            let k = document.createElement('div');
            k.className = 'key';
            kb.appendChild(k);
        }

        function update() {
            const noteNames = ["C", "D", "E", "F", "G", "A", "B"];
            const color = chakraColors[pitch % 7];
            const octave = Math.floor(pitch / 12) - 1;
            
            document.getElementById('note-label').textContent = noteNames[pitch % 7] + octave;
            document.getElementById('note-label').style.color = color;
            
            const head = document.getElementById('note-head');
            head.style.color = color;
            // Anchor Middle C (60) to the ledger space below the staff (115px)
            // 14px step corresponds to the space between lines.
            head.style.top = (115 - (whiteKeys.indexOf(pitch)) * 14) + 'px';
            
            document.querySelectorAll('.key').forEach((el, idx) => {
                el.style.backgroundColor = (idx === whiteKeys.indexOf(pitch)) ? color : '#fff';
            });
        }

        document.querySelectorAll('button').forEach(b => {
            b.addEventListener('pointerdown', (e) => {
                const dir = e.target.dataset.dir;
                let currentIndex = whiteKeys.indexOf(pitch);
                if(dir === 'up') pitch = whiteKeys[Math.min(currentIndex + 1, whiteKeys.length - 1)];
                if(dir === 'down') pitch = whiteKeys[Math.max(currentIndex - 1, 0)];
                update();
            });
        });
        update();
    </script>
</body>
</html>
