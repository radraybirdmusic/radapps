<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TRUMPET GARDEN v2.25</title>
</head>
<body style="margin:0; background:#000; color:#fff; font-family:monospace; overflow:hidden; touch-action:none; width:100vw; height:100vh;">

    <div id="gate" style="position:fixed; inset:0; background:#000; z-index:9999; display:flex; flex-direction:column; justify-content:center; align-items:center;">
        <button id="b-mic" style="padding:40px 80px; font-size:24px; background:#111; border:4px solid #0f0; color:#0f0; border-radius:20px; font-weight:bold; cursor:pointer;">IGNITE v2.25</button>
    </div>

    <div id="ui" style="display:none; position:absolute; inset:0; z-index:100; background:#000;">
        
        <div id="header" style="position:absolute; top:0; width:100%; height:130px; background:#111; border-bottom:3px solid #333; z-index:1500; box-sizing:border-box;">
            <div id="rec-progress" style="position:absolute; bottom:0; left:0; height:4px; background:#0f0; width:0%;"></div>
            <div style="display:flex; align-items:center; justify-content:space-around; height:90px; padding:5px;">
                <div style="display:flex; gap:8px;">
                    <button id="b-rec" style="width:50px; height:50px; border-radius:50%; background:#222; border:2px solid #fff; font-size:22px;">🐝</button>
                    <div style="display:flex; flex-direction:column; gap:4px;">
                        <button id="p-rec-play" style="background:#222; border:2px solid #ffcc00; color:#ffcc00; border-radius:8px; width:55px; height:22px; font-size:9px;">PLAY</button>
                        <button id="s-rec-stop" style="background:#222; border:2px solid #ffcc00; color:#ffcc00; border-radius:8px; width:55px; height:22px; font-size:8px;">STOP</button>
                    </div>
                </div>
                <div style="display:flex; gap:8px;">
                    <button id="p-lock" style="background:#222; border:2px solid #9d00ff; color:#fff; border-radius:8px; width:70px; height:45px; font-weight:bold; font-size:11px;" onclick="toggleLock()">LOCK</button>
                    <button id="b-save" style="background:#222; border:2px solid #44aaff; color:#44aaff; border-radius:8px; width:70px; height:45px; font-weight:bold; font-size:11px;">SAVE</button>
                    <button id="b-glitch" style="background:#222; border:2px solid #ff4444; color:#ff4444; border-radius:8px; width:70px; height:45px; font-weight:bold; font-size:11px;">GLITCH</button>
                </div>
                <div style="display:flex; gap:8px;">
                    <div style="display:flex; flex-direction:column; gap:4px;">
                        <button id="p-file-play" style="background:#222; border:2px solid #888; color:#888; border-radius:8px; width:55px; height:22px; font-size:9px;">PLAY</button>
                        <button id="s-file-stop" style="background:#222; border:2px solid #888; color:#888; border-radius:8px; width:55px; height:22px; font-size:8px;">STOP</button>
                    </div>
                    <button id="b-file" style="width:50px; height:50px; border-radius:50%; background:#222; border:2px solid #fff; font-size:22px;">📂</button>
                </div>
            </div>
            <div id="diag" style="width:100%; text-align:center; font-size:10px; color:#0f0; font-weight:bold;">STATUS: v2.25 RESTORED</div>
            <input type="file" id="f-in" hidden accept="audio/*">
        </div>

        <button class="ham" style="position:absolute; top:145px; left:4%; padding:6px 12px; border:2px solid #ffcc00; color:#ffcc00; background:#000; border-radius:4px; z-index:1000;" onpointerdown="hamMomentum(0.94)">HAM L-</button>
        <button class="ham" style="position:absolute; top:145px; right:4%; padding:6px 12px; border:2px solid #ffcc00; color:#ffcc00; background:#000; border-radius:4px; z-index:1000;" onpointerdown="hamMomentum(1.06)">HAM R+</button>

        <div id="l-s" style="position:absolute; width:45px; height:180px; background:#111; border:2px solid #555; border-radius:25px; top:240px; left:3%; z-index:300;" onpointerdown="slide(event,'l')" onpointermove="slide(event,'l')"><div id="l-f" style="width:100%; position:absolute; bottom:0; background:linear-gradient(to top, #FF4500, #fff); border-radius:25px; height:50%;"></div></div>
        <div id="r-s" style="position:absolute; width:45px; height:180px; background:#111; border:2px solid #555; border-radius:25px; top:240px; right:3%; z-index:300;" onpointerdown="slide(event,'r')" onpointermove="slide(event,'r')"><div id="r-f" style="width:100%; position:absolute; bottom:0; background:linear-gradient(to top, #FF4500, #fff); border-radius:25px; height:50%;"></div></div>

        <svg id="pad-left" style="position:absolute; bottom:20px; left:8%; width:42%; height:auto; z-index:400;" viewBox="0 0 220 280">
            <g stroke="#fff" stroke-width="2.5" fill="none">
                <circle cx="30" cy="35" r="20"/><circle cx="80" cy="35" r="20"/><circle cx="130" cy="35" r="20"/><circle cx="180" cy="35" r="6"/>
                <circle cx="30" cy="90" r="20"/><circle cx="80" cy="90" r="20"/><circle cx="130" cy="90" r="20"/><circle cx="180" cy="90" r="6"/>
            </circle>
        </svg>
        <svg id="pad-right" style="position:absolute; bottom:20px; right:8%; width:42%; height:auto; z-index:400;" viewBox="0 0 220 280">
            <g stroke="#fff" stroke-width="2.5" fill="none">
                <circle cx="40" cy="35" r="6"/><circle cx="90" cy="35" r="20"/><circle cx="140" cy="35" r="20"/><circle cx="190" cy="35" r="20"/>
                <circle cx="40" cy="90" r="6"/><circle cx="90" cy="90" r="20"/><circle cx="140" cy="90" r="20"/><circle cx="190" cy="90" r="20"/>
            </circle>
        </svg>
    </div>
    <canvas id="osc" style="position:absolute; inset:0; z-index:10; pointer-events:none;"></canvas>
<script>
let aCtx, anal, src, rec, chks = [], virtualCache = null, isL = false, isF = false, ints = {l:0.5, r:0.5}, isR = false, activeSources = [];
let currentArpPitch = 1.0;
const cvs = document.getElementById('osc'), ctx = cvs.getContext('2d'), diag = document.getElementById('diag'), prog = document.getElementById('rec-progress');

document.getElementById('b-mic').onclick = async () => {
    document.getElementById('gate').style.display = 'none'; 
    document.getElementById('ui').style.display = 'block';
    try {
        aCtx = new (window.AudioContext || window.webkitAudioContext)();
        anal = aCtx.createAnalyser(); anal.fftSize = 2048; 
        anal.connect(aCtx.destination);
        draw(); 
    } catch (err) { diag.innerText = "CONTEXT ERROR"; }
};

async function hamMomentum(multiplier) {
    if (!virtualCache) return;
    if (aCtx.state === 'suspended') await aCtx.resume();
    currentArpPitch *= multiplier;
    const res = await fetch(virtualCache);
    const ab = await res.arrayBuffer();
    aCtx.decodeAudioData(ab, (buffer) => {
        const s = aCtx.createBufferSource(); s.buffer = buffer; 
        s.playbackRate.value = currentArpPitch;
        s.connect(anal); s.start(0);
        activeSources.push(s); 
    });
}

document.getElementById('b-file').onclick = () => document.getElementById('f-in').click();
document.getElementById('f-in').onchange = (e) => {
    const reader = new FileReader();
    reader.onload = (re) => { virtualCache = re.target.result; diag.innerText = "📂 LOADED"; };
    reader.readAsDataURL(e.target.files[0]);
};

document.getElementById('p-file-play').onclick = () => { currentArpPitch = 1.0; hamMomentum(1.0); };
document.getElementById('s-file-stop').onclick = () => { activeSources.forEach(s => s.stop()); activeSources = []; };

function slide(e, s) {
    if (isL) return;
    const r = e.currentTarget.getBoundingClientRect();
    const y = e.touches ? e.touches[0].clientY : e.clientY;
    let v = 1 - (y - r.top) / r.height;
    ints[s] = Math.max(0, Math.min(1.5, v * 1.5));
    document.getElementById(s + '-f').style.height = (ints[s] / 1.5) * 100 + "%";
}

function draw() {
    requestAnimationFrame(draw); if (!anal) return;
    cvs.width = window.innerWidth; cvs.height = window.innerHeight;
    const d = new Uint8Array(anal.frequencyBinCount); anal.getByteTimeDomainData(d);
    ctx.clearRect(0, 0, cvs.width, cvs.height); ctx.lineWidth = 4; ctx.strokeStyle = "#9d00ff";
    ctx.beginPath(); let sw = cvs.width / d.length;
    for (let i = 0; i < d.length; i++) {
        const y = (d[i] / 128.0) * cvs.height / 2;
        if (i === 0) ctx.moveTo(i * sw, y); else ctx.lineTo(i * sw, y);
    }
    ctx.stroke();
}

function toggleLock() { isL = !isL; document.getElementById('p-lock').innerText = isL ? "LOCKED" : "LOCK"; }
</script>
</body>
</html>
