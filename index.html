<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CRi1 Piano Learner</title>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; height: 100vh; display: flex; flex-direction: column; align-items: center; background: #fff; overflow: hidden; }
        
        /* Staff Area */
        #staff-container { width: 100%; height: 150px; background-image: linear-gradient(to bottom, #333 2px, transparent 2px); background-size: 100% 30px; background-position: 0 30px; border-bottom: 2px solid #333; position: relative; }
        #note-display { position: absolute; font-size: 30px; font-weight: bold; transition: top 0.1s; left: 50%; }

        /* Controls */
        #controls { display: flex; align-items: center; gap: 20px; margin: 10px 0; }
        #clef-indicator { font-size: 40px; font-weight: bold; width: 50px; text-align: center; }
        #d-pad { display: grid; grid-template-columns: repeat(3, 60px); gap: 5px; }
        button { height: 60px; border-radius: 8px; border: 1px solid #333; }

        /* Keyboard Area */
        #keyboard { display: flex; width: 100%; height: 120px; overflow-x: auto; border-top: 2px solid #333; }
        .key { flex: 1; border: 1px solid #000; }
        .white { background: white; }
        .black { background: black; width: 30px; margin-left: -15px; margin-right: -15px; z-index: 2; }
    </style>
</head>
<body>

    <div id="staff-container">
        <div id="note-display">C4</div>
    </div>

    <div id="controls">
        <div id="clef-indicator">T</div>
        <div id="d-pad">
            <div></div><button data-dir="up">^</button><div></div>
            <button data-dir="left"><</button><div></div><button data-dir="right">></button>
            <div></div><button data-dir="down">v</button><div></div>
        </div>
        <div id="clef-indicator">B</div>
    </div>

    <div id="keyboard" id="keys-container"></div>

    <script>
        let pitch = 60; // Start at Middle C
        const chakraColors = ["#FF0000", "#FF7F00", "#FFFF00", "#00FF00", "#0000FF", "#4B0082", "#9400D3"];
        
        // Generate 49 keys
        const keyboard = document.getElementById('keyboard');
        for(let i = 0; i < 49; i++) {
            const key = document.createElement('div');
            key.className = 'key ' + ([1,3,6,8,10].includes(i % 12) ? 'black' : 'white');
            key.id = `key-${i}`;
            keyboard.appendChild(key);
        }

        function update() {
            // Logic: Middle C (60) is the pivot
            // Treble is 60+, Bass is below 60
            document.querySelectorAll('#clef-indicator')[0].style.opacity = (pitch >= 60) ? 1 : 0.2; // Treble
            document.querySelectorAll('#clef-indicator')[1].style.opacity = (pitch < 60) ? 1 : 0.2; // Bass
            
            const noteEl = document.getElementById('note-display');
            noteEl.style.color = chakraColors[pitch % 7];
            noteEl.style.top = (120 - (pitch - 60) * 10) + 'px';
            
            // Highlight active key
            document.querySelectorAll('.key').forEach(k => k.style.borderColor = 'black');
            document.getElementById(`key-${pitch - 36}`).style.borderColor = 'red';
        }

        document.querySelectorAll('button').forEach(btn => {
            btn.addEventListener('pointerdown', (e) => {
                const dir = e.target.dataset.dir;
                if(dir === 'up') pitch++;
                if(dir === 'down') pitch--;
                update();
            });
        });
        update();
    </script>
</body>
</html>
