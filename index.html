<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CRi1 Music Learner</title>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; height: 100vh; background: #fff; overflow: hidden; font-family: sans-serif; touch-action: none; }
        
        /* 5-line staff with 30px gaps. Top gap of 80px created by top: 80px */
        #staff-canvas { 
            position: absolute !important; top: 80px !important; left: 5% !important; 
            width: 90% !important; height: 120px !important; 
            background-image: repeating-linear-gradient(to bottom, #000, #000 2px, transparent 2px, transparent 30px);
            background-position: 0 0; 
        }
        #note-head { 
            position: absolute; left: 45%; font-size: 20px; transition: top 0.1s; 
            transform: translate(-50%, -50%);
        }

        /* Controls Layout */
        #controls { position: absolute; top: 250px; width: 100%; display: flex; align-items: center; justify-content: center; gap: 15px; }
        #d-pad { display: grid; grid-template-columns: repeat(3, 50px); gap: 5px; }
        #note-label { font-size: 20px; font-weight: bold; text-align: center; }
        button { height: 50px; border-radius: 8px; border: 1px solid #333; background: #eee; }

        #keyboard { position: absolute; bottom: 0; width: 100%; height: 80px; display: flex; border-top: 3px solid #000; }
        .key { flex: 1; border: 1px solid #000; background: #fff; }
    </style>
</head>
<body>

    <div id="staff-canvas"><div id="note-head">●</div></div>

    <div id="controls">
        <div style="font-weight:bold; font-size: 24px;">B</div>
        <div id="d-pad">
            <div></div><button data-dir="up">^</button><div></div>
            <button data-dir="left"><</button><div id="note-label">C4</div><button data-dir="right">></button>
            <div></div><button data-dir="down">v</button><div></div>
        </div>
        <div style="font-weight:bold; font-size: 24px;">T</div>
    </div>

    <div id="keyboard"></div>

    <script>
        // Start at C4 (60). 
        let pitch = 60; 
        const chakraColors = ["#FF0000", "#FF7F00", "#FFFF00", "#00FF00", "#0000FF", "#4B0082", "#9400D3"];
        
        const kb = document.getElementById('keyboard');
        for(let i = 0; i < 29; i++) {
            let k = document.createElement('div');
            k.className = 'key';
            kb.appendChild(k);
        }

        function update() {
            const noteNames = ["C", "D", "E", "F", "G", "A", "B"];
            const color = chakraColors[pitch % 7];
            const octave = Math.floor(pitch / 12) - 1;
            
            document.getElementById('note-label').textContent = noteNames[pitch % 7] + octave;
            document.getElementById('note-label').style.color = color;
            
            const head = document.getElementById('note-head');
            head.style.color = color;
            // Direction reversed: higher pitch = lower top value (moving UP the screen)
            head.style.top = (120 - (pitch - 60) * 15) + 'px';
            
            document.querySelectorAll('.key').forEach((el, idx) => {
                el.style.backgroundColor = (idx === (pitch - 60)) ? color : '#fff';
            });
        }

        document.querySelectorAll('button').forEach(b => {
            b.addEventListener('pointerdown', (e) => {
                const dir = e.target.dataset.dir;
                if(dir === 'up') pitch++;
                if(dir === 'down') pitch--;
                update();
            });
        });
        update();
    </script>
</body>
</html>
