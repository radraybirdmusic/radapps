<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TRUMPET GARDEN v2.16</title>
    <style>
        :root { --p: #9d00ff; --o: #FF4500; --g: #0f0; --y: #ffcc00; --gry: #888; }
        body { margin: 0; background: #000; color: #fff; font-family: sans-serif; overflow: hidden; touch-action: none; width: 100vw; height: 100vh; }
        .fae { filter: invert(1) hue-rotate(180deg); background: #fff !important; }
        #ui { position: absolute; inset: 0; background: #000; z-index: 100; }
        #header { position: absolute; top: 0; width: 100%; height: 130px; background: #111; border-bottom: 3px solid #333; z-index: 1000; box-sizing: border-box; }
        #rec-progress { position: absolute; bottom: 0; left: 0; height: 4px; background: var(--g); width: 0%; transition: width 0.1s linear; }
        .nav-container { display: flex; align-items: center; justify-content: space-around; height: 90px; padding: 5px; }
        .nav-group { display: flex; align-items: center; gap: 8px; }
        .btn { background: #222; border: 2px solid var(--p); color: #fff; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 11px; text-align: center; height: 45px; }
        .q-width { width: 70px !important; min-width: 70px; }
        .mini-btn { width: 50px; height: 50px; border-radius: 50%; background: #222; border: 2px solid #fff; color: #fff; display: flex; align-items: center; justify-content: center; font-size: 22px; cursor: pointer; }
        .col-btn { display: flex; flex-direction: column; gap: 4px; }
        .mini-label { font-size: 9px; width: 55px; height: 22px; }
        #diag { width: 100%; text-align: center; font-size: 10px; color: var(--g); padding-top: 5px; font-weight: bold; }
        
        /* v2.16 DE-JAMMED UI ELEMENTS */
        .ham { position: absolute; top: 140px; padding: 8px 15px; font-size: 11px; border: 2px solid var(--y); color: var(--y); background: #000; border-radius: 4px; cursor: pointer; z-index: 600; }
        #ham-l { left: 10%; } #ham-r { right: 10%; }
        
        .sld { position: absolute; width: 45px; height: 180px; background: #111; border: 2px solid #555; border-radius: 25px; top: 220px; z-index: 400; }
        #l-s { left: 2%; } #r-s { right: 2%; }
        .fill { width: 100%; position: absolute; bottom: 0; background: linear-gradient(to top, var(--o), #fff); border-radius: 25px; pointer-events: none; }
        
        .pad-grid { position: absolute; bottom: 10px; width: 42%; height: auto; pointer-events: auto; z-index: 300; }
        #pad-left { left: 8%; } #pad-right { right: 8%; }
        
        #osc { position: absolute; inset: 0; z-index: 10; pointer-events: none; }
    </style>
</head>
<body>
<div id="ui">
    <div id="header">
        <div id="rec-progress"></div>
        <div class="nav-container">
            <div class="nav-group">
                <button id="b-rec" class="mini-btn" onclick="wake()">🐝</button>
                <div class="col-btn">
                    <button id="p-rec-play" class="btn mini-label" style="border-color:var(--y); color:var(--y);" onclick="playCache()">PLAY</button>
                    <button id="s-rec-stop" class="btn mini-label" style="border-color:var(--y); color:var(--y);" onclick="stopAll()">STOP</button>
                </div>
            </div>
            <div class="nav-group">
                <button id="p-lock" class="btn q-width" onclick="toggleLock()">LOCK</button>
                <button id="b-save" class="btn q-width" style="border-color:#44aaff; color:#44aaff;" onclick="saveMaster()">SAVE</button>
                <button id="b-glitch" class="btn q-width" style="border-color:#ff4444; color:#ff4444;">GLITCH</button>
            </div>
            <div class="nav-group">
                <div class="col-btn">
                    <button id="p-file-play" class="btn mini-label" style="border-color:var(--gry); color:var(--gry);" onclick="playCache()">PLAY</button>
                    <button id="s-file-stop" class="btn mini-label" style="border-color:var(--gry); color:var(--gry);" onclick="stopAll()">STOP</button>
                </div>
                <button id="b-file" class="mini-btn" onclick="openFile()">📂</button>
            </div>
        </div>
        <div id="diag">STATUS: v2.16 DE-JAMMED</div>
        <input type="file" id="f-in" hidden accept="*">
    </div>

    <button id="ham-l" class="ham" onpointerdown="hamMomentum(0.94)">HAM L-</button>
    <button id="ham-r" class="ham" onpointerdown="hamMomentum(1.06)">HAM R+</button>

    <div id="l-s" class="sld" onpointerdown="slide(event,'l')" onpointermove="slide(event,'l')"><div id="l-f" class="fill" style="height:50%"></div></div>
    <div id="r-s" class="sld" onpointerdown="slide(event,'r')" onpointermove="slide(event,'r')"><div id="r-f" class="fill" style="height:50%"></div></div>

    <svg id="pad-left" class="pad-grid" viewBox="0 0 220 280">
        <g stroke="#fff" stroke-width="2.5" fill="none">
            <circle cx="30" cy="35" r="20" onpointerdown="pulse(event, 1.0)"/><circle cx="80" cy="35" r="20" onpointerdown="pulse(event, 1.1)"/><circle cx="130" cy="35" r="20" onpointerdown="pulse(event, 1.2)"/><circle cx="180" cy="35" r="6" onpointerdown="pulse(event, 1.5)"/>
            <circle cx="30" cy="90" r="20" onpointerdown="pulse(event, 0.8)"/><circle cx="80" cy="90" r="20" onpointerdown="pulse(event, 0.9)"/><circle cx="130" cy="90" r="20" onpointerdown="pulse(event, 1.0)"/><circle cx="180" cy="90" r="6" onpointerdown="pulse(event, 1.2)"/>
            <circle cx="30" cy="145" r="20" onpointerdown="pulse(event, 0.6)"/><circle cx="80" cy="145" r="20" onpointerdown="pulse(event, 0.7)"/><circle cx="130" cy="145" r="20" onpointerdown="pulse(event, 0.8)"/><circle cx="180" cy="145" r="6" onpointerdown="pulse(event, 1.0)"/>
        </g>
    </svg>

    <svg id="pad-right" class="pad-grid" viewBox="0 0 220 280">
        <g stroke="#fff" stroke-width="2.5" fill="none">
            <circle cx="40" cy="35" r="6" onpointerdown="pulse(event, 1.5)"/><circle cx="90" cy="35" r="20" onpointerdown="pulse(event, 1.2)"/><circle cx="140" cy="35" r="20" onpointerdown="pulse(event, 1.1)"/><circle cx="190" cy="35" r="20" onpointerdown="pulse(event, 1.0)"/>
            <circle cx="40" cy="90" r="6" onpointerdown="pulse(event, 1.2)"/><circle cx="90" cy="90" r="20" onpointerdown="pulse(event, 1.0)"/><circle cx="140" cy="90" r="20" onpointerdown="pulse(event, 0.9)"/><circle cx="190" cy="90" r="20" onpointerdown="pulse(event, 0.8)"/>
            <circle cx="40" cy="145" r="6" onpointerdown="pulse(event, 1.0)"/><circle cx="90" cy="145" r="20" onpointerdown="pulse(event, 0.8)"/><circle cx="140" cy="145" r="20" onpointerdown="pulse(event, 0.7)"/><circle cx="190" cy="145" r="20" onpointerdown="pulse(event, 0.6)"/>
        </g>
    </svg>
</div>
<canvas id="osc"></canvas>

<script>
let aCtx, anal, masterBus, rec, chks = [], virtualCache = null, activeSources = [], isL = false, currentArpPitch = 1.0, isF = false, ints = {l:0.5, r:0.5};

async function wake() {
    if (!aCtx) {
        aCtx = new (window.AudioContext || window.webkitAudioContext)();
        anal = aCtx.createAnalyser(); anal.fftSize = 1024;
        masterBus = aCtx.createMediaStreamDestination();
        anal.connect(aCtx.destination);
        draw();
    }
    if (aCtx.state === 'suspended') await aCtx.resume();
}

async function pulse(e, pitch) {
    await wake();
    if (!virtualCache) return;
    const rect = e.target.getBoundingClientRect();
    const v = Math.max(0.1, 1 - (Math.sqrt(Math.pow(e.clientX - (rect.left+rect.width/2), 2) + Math.pow(e.clientY - (rect.top+rect.height/2), 2)) / rect.width));
    const res = await fetch(virtualCache);
    const ab = await res.arrayBuffer();
    aCtx.decodeAudioData(ab, (buffer) => {
        const s = aCtx.createBufferSource(), g = aCtx.createGain();
        s.buffer = buffer; s.playbackRate.value = pitch * currentArpPitch + (v * 0.1);
        g.gain.setValueAtTime(v, aCtx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.001, aCtx.currentTime + 1.2);
        s.connect(g); g.connect(anal); g.connect(masterBus);
        s.start(0); activeSources.push(s); 
    });
}

async function hamMomentum(multiplier) {
    await wake();
    currentArpPitch *= multiplier;
    document.getElementById('diag').innerText = `OCTAVE: ${currentArpPitch.toFixed(2)}`;
}

function slide(e, s) {
    if (isL || (e.buttons !== 1 && !e.touches)) return;
    const r = e.currentTarget.getBoundingClientRect();
    const y = e.touches ? e.touches[0].clientY : e.clientY;
    let v = 1 - (y - r.top) / r.height;
    ints[s] = Math.max(0, Math.min(1.5, v * 1.5));
    document.getElementById(s + '-f').style.height = (ints[s] / 1.5) * 100 + "%";
    if (ints.l > 1.0 || ints.r > 1.0) { document.body.classList.add('fae'); isF = true; } else { document.body.classList.remove('fae'); isF = false; }
}

function draw() {
    requestAnimationFrame(draw); if (!anal) return;
    const cvs = document.getElementById('osc'), ctx = cvs.getContext('2d');
    cvs.width = window.innerWidth; cvs.height = window.innerHeight;
    const t = new Uint8Array(anal.frequencyBinCount), f = new Uint8Array(anal.frequencyBinCount);
    anal.getByteTimeDomainData(t); anal.getByteFrequencyData(f);
    let avg = f.reduce((a, b) => a + b) / f.length;
    ctx.clearRect(0, 0, cvs.width, cvs.height);
    ctx.lineWidth = 5;
    ctx.strokeStyle = avg > 2 ? `hsl(${(avg * 2) % 360}, 100%, 50%)` : (isF ? "#000" : "#333");
    ctx.beginPath(); let sw = cvs.width / t.length;
    for (let i = 0; i < t.length; i++) {
        const y = (t[i] / 128.0) * cvs.height / 2;
        if (i === 0) ctx.moveTo(0, y); else ctx.lineTo(i * sw, y);
    }
    ctx.stroke();
}

document.getElementById('b-rec').onclick = async () => {
    await wake();
    if (rec && rec.state === "recording") return;
    chks = []; rec = new MediaRecorder(masterBus.stream);
    rec.ondataavailable = e => chks.push(e.data);
    rec.onstop = async () => {
        const blob = new Blob(chks, { type: 'audio/webm' });
        const reader = new FileReader();
        reader.onloadend = () => { virtualCache = reader.result; document.getElementById('diag').innerText = "v2.16 CACHED"; };
        reader.readAsDataURL(blob);
    };
    rec.start();
    let start = Date.now();
    let int = setInterval(() => {
        let elapsed = Date.now() - start;
        document.getElementById('rec-progress').style.width = Math.min((elapsed / 3500) * 100, 100) + '%';
        if (elapsed >= 3500) { clearInterval(int); if(rec.state==="recording") rec.stop(); }
    }, 50);
};

function openFile() { document.getElementById('f-in').click(); }
document.getElementById('f-in').onchange = (e) => {
    const r = new FileReader();
    r.onload = (re) => { virtualCache = re.target.result; document.getElementById('diag').innerText = "📂 LOADED"; };
    r.readAsDataURL(e.target.files[0]);
};

function playCache() { pulse({target: document.querySelector('circle'), clientX: 0, clientY: 0}, 1.0); }
function stopAll() { activeSources.forEach(s => { try{s.stop()}catch(e){} }); activeSources = []; }
function saveMaster() { if(virtualCache) { const l = document.createElement('a'); l.href = virtualCache; l.download = "master.webm"; l.click(); } }
function toggleLock() { isL = !isL; document.getElementById('p-lock').innerText = isL ? "LOCKED" : "LOCK"; }
</script>
</body>
</html>
