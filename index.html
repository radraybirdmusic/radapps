<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CRi1 Music Learner</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { height: 100vh; background: #fff; overflow: hidden; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; }
        
        #audio-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: #fff; z-index: 100; display: flex; justify-content: center; align-items: center; }
        #top-gap { height: 20px; width: 100%; }
        #staff-canvas { width: 90%; height: 122px; background-image: repeating-linear-gradient(to bottom, #000, #000 2px, transparent 2px, transparent 30px); position: relative; }
        
        /* Note head positioned horizontally centered over the B key slot */
        #note-head { position: absolute; left: 32%; font-size: 25px; transition: top 0.1s; transform: translate(-50%, -50%); }
        
        #controls { margin-top: 20px; display: flex; align-items: center; gap: 15px; }
        #d-pad { display: grid; grid-template-columns: 50px 50px 50px; gap: 5px; align-items: center; justify-items: center; position: relative; }
        
        /* Solfège label positioned to the left of the Up button and above the Left button */
        #solfege-label {
            position: absolute;
            top: 0px;
            left: 0px;
            width: 50px;
            height: 50px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 14px;
            font-weight: bold;
        }

        /* Duration label positioned to the right of the Up button and above the Right button in black */
        #duration-label {
            position: absolute;
            top: 0px;
            right: 0px;
            width: 50px;
            height: 50px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 12px;
            font-weight: bold;
            color: #000000;
        }

        .label-container { width: 50px; text-align: center; font-size: 20px; font-weight: bold; }
        button { height: 50px; width: 50px; border-radius: 8px; border: 1px solid #333; background: #eee; }
        .clef-lit { font-weight: bold; font-size: 24px; color: #000; }
        .clef-unlit { font-weight: bold; font-size: 24px; color: #ccc; }

        /* Keyboard visual container below the D-pad */
        #keyboard-container {
            margin-top: 25px;
            width: 90%;
            max-width: 400px;
            height: 90px;
            position: relative;
            background: #222;
            border-radius: 6px;
            padding: 4px;
            display: flex;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .white-key {
            flex: 1;
            background: #ffffff;
            border: 1px solid #999;
            border-radius: 0 0 4px 4px;
            height: 100%;
            z-index: 1;
            transition: background-color 0.1s;
        }
        .black-key-slot {
            position: relative;
            flex: 0;
            width: 0;
            z-index: 2;
        }
        .black-key {
            position: absolute;
            top: 0;
            left: -10px;
            width: 20px;
            height: 55%;
            background: #111;
            border-radius: 0 0 3px 3px;
            border: 1px solid #000;
        }
    </style>
</head>
<body>

    <div id="audio-overlay"><button id="start-btn" style="width: 150px; height: 50px; font-size: 18px;">Start App</button></div>
    <div id="top-gap"></div>
    <div id="staff-canvas"><div id="note-head">●</div></div>

    <div id="controls">
        <div id="clef-b" class="clef-unlit">B</div>
        <div id="d-pad">
            <div id="solfege-label">Do</div>
            <div id="duration-label">16th</div>
            <div></div><button data-dir="up">^</button><div></div>
            <button data-dir="left"><</button>
            <div id="note-label" class="label-container">C4</div>
            <button data-dir="right">></button>
            <div></div><button data-dir="down">v</button><div></div>
        </div>
        <div id="clef-t" class="clef-lit">T</div>
    </div>

    <!-- 3-Octave Piano Keyboard Visual Centered on Middle C -->
    <div id="keyboard-container">
        <!-- Octave 3 White Keys (C3 to B3) -->
        <div class="white-key" data-note="C3"></div>
        <div class="black-key-slot"><div class="black-key"></div></div>
        <div class="white-key" data-note="D3"></div>
        <div class="black-key-slot"><div class="black-key"></div></div>
        <div class="white-key" data-note="E3"></div>
        <div class="white-key" data-note="F3"></div>
        <div class="black-key-slot"><div class="black-key"></div></div>
        <div class="white-key" data-note="G3"></div>
        <div class="black-key-slot"><div class="black-key"></div></div>
        <div class="white-key" data-note="A3"></div>
        <div class="black-key-slot"><div class="black-key"></div></div>
        <div class="white-key" data-note="B3"></div>

        <!-- Octave 4 White Keys (C4 to B4) -->
        <div class="white-key" data-note="C4"></div>
        <div class="black-key-slot"><div class="black-key"></div></div>
        <div class="white-key" data-note="D4"></div>
        <div class="black-key-slot"><div class="black-key"></div></div>
        <div class="white-key" data-note="E4"></div>
        <div class="white-key" data-note="F4"></div>
        <div class="black-key-slot"><div class="black-key"></div></div>
        <div class="white-key" data-note="G4"></div>
        <div class="black-key-slot"><div class="black-key"></div></div>
        <div class="white-key" data-note="A4"></div>
        <div class="black-key-slot"><div class="black-key"></div></div>
        <div class="white-key" data-note="B4"></div>

        <!-- Octave 5 White Keys (C5 to A5/C6) -->
        <div class="white-key" data-note="C5"></div>
        <div class="black-key-slot"><div class="black-key"></div></div>
        <div class="white-key" data-note="D5"></div>
        <div class="black-key-slot"><div class="black-key"></div></div>
        <div class="white-key" data-note="E5"></div>
        <div class="white-key" data-note="F5"></div>
        <div class="black-key-slot"><div class="black-key"></div></div>
        <div class="white-key" data-note="G5"></div>
        <div class="black-key-slot"><div class="black-key"></div></div>
        <div class="white-key" data-note="A5"></div>
        <div class="black-key-slot"><div class="black-key"></div></div>
        <div class="white-key" data-note="C6"></div>
    </div>

    <script>
        const solfegeMap = {
            "C": "Do", "D": "Re", "E": "Mi", "F": "Fa", "G": "Sol", "A": "La", "B": "Ti"
        };

        const trebleScale = [
            {name: "C4", top: 150, freq: 261.63}, {name: "D4", top: 135, freq: 293.66}, {name: "E4", top: 120, freq: 329.63}, 
            {name: "F4", top: 105, freq: 349.23}, {name: "G4", top: 90, freq: 392.00}, {name: "A4", top: 75, freq: 440.00}, 
            {name: "B4", top: 60, freq: 493.88}, {name: "C5", top: 45, freq: 523.25}, {name: "D5", top: 30, freq: 587.33}, 
            {name: "E5", top: 15, freq: 659.25}, {name: "F5", top: 0, freq: 698.46}, {name: "G5", top: -15, freq: 783.99}, 
            {name: "A5", top: -30, freq: 880.00}
        ];
        
        const bassScale = [
            {name: "C4", top: -30, freq: 261.63}, {name: "B3", top: -15, freq: 246.94}, {name: "A3", top: 0, freq: 220.00}, 
            {name: "G3", top: 15, freq: 196.00}, {name: "F3", top: 30, freq: 174.61}, {name: "E3", top: 45, freq: 164.81}, 
            {name: "D3", top: 60, freq: 146.83}, {name: "C3", top: 75, freq: 130.81}, {name: "B2", top: 90, freq: 123.47}, 
            {name: "A2", top: 105, freq: 110.00}, {name: "G2", top: 120, freq: 98.00}, {name: "F2", top: 135, freq: 87.31}, 
            {name: "E2", top: 150, freq: 82.41}
        ];

        const chakraColors = ["#FF0000", "#FF7F00", "#FFFF00", "#00FF00", "#0000FF", "#4B0082", "#9400D3"];
        const durations = ["16th", "8th", "quarter", "half", "whole"];
        const durationSeconds = [0.2, 0.4, 0.8, 1.6, 3.2];
        let durationIdx = 0;
        let audioCtx;
        
        document.getElementById('start-btn').addEventListener('click', () => {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            audioCtx.resume();
            document.getElementById('audio-overlay').style.display = 'none';
        });

        function playTone(freq) {
            if (!audioCtx) return;
            const duration = durationSeconds[durationIdx];
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.frequency.value = freq;
            gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + duration);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + duration);
        }
        
        let mode = "treble";
        let idx = 0; 
        
        function update(playSound = false) {
            const scale = (mode === "treble") ? trebleScale : bassScale;
            const currentNote = scale[idx];
            const noteLetter = currentNote.name.charAt(0);
            const activeColor = chakraColors[idx % 7];
            
            // Update Note Label
            const label = document.getElementById('note-label');
            label.textContent = currentNote.name;
            label.style.color = activeColor;

            // Update Solfege Label
            const solfegeEl = document.getElementById('solfege-label');
            solfegeEl.textContent = solfegeMap[noteLetter];
            solfegeEl.style.color = activeColor;

            // Update Note Head
            const head = document.getElementById('note-head');
            head.style.color = activeColor;
            head.style.top = currentNote.top + 'px';

            // Update Clefs
            document.getElementById('clef-t').className = (mode === "treble") ? "clef-lit" : "clef-unlit";
            document.getElementById('clef-b').className = (mode === "bass") ? "clef-lit" : "clef-unlit";

            // Update Duration Label text
            document.getElementById('duration-label').textContent = durations[durationIdx];

            // Update Piano Keys (Light the matching key with current note's chakra color)
            document.querySelectorAll('.white-key').forEach(key => {
                if (key.dataset.note === currentNote.name) {
                    key.style.backgroundColor = activeColor;
                } else {
                    key.style.backgroundColor = '#ffffff';
                }
            });
            
            if (playSound) playTone(currentNote.freq);
        }

        document.querySelectorAll('button').forEach(b => {
            if(b.id === 'start-btn') return;
            b.addEventListener('pointerdown', (e) => {
                const dir = e.target.dataset.dir;
                if (!dir) return;

                if (dir === 'right') {
                    durationIdx = (durationIdx + 1) % durations.length;
                    update(false);
                    return;
                } else if (dir === 'left') {
                    durationIdx = (durationIdx - 1 + durations.length) % durations.length;
                    update(false);
                    return;
                }

                if (mode === "treble") {
                    if (dir === 'up') idx = Math.min(idx + 1, trebleScale.length - 1);
                    else if (dir === 'down') {
                        if (idx === 0) { mode = "bass"; idx = 0; }
                        else idx = Math.max(idx - 1, 0);
                    }
                } else {
                    if (dir === 'up') {
                        if (idx === 0) { mode = "treble"; idx = 0; }
                        else idx = Math.max(idx - 1, 0);
                    } else if (dir === 'down') {
                        idx = Math.min(idx + 1, bassScale.length - 1);
                    }
                }
                update(true);
            });
        });
        update();
    </script>
</body>
</html>
