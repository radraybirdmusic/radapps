<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CRi1 Music Learner</title>
    <style>
        * { box-sizing: border-box; }
        body { 
            margin: 0; height: 100vh; display: flex; flex-direction: column; 
            align-items: center; justify-content: space-between; 
            font-family: sans-serif; touch-action: none; overflow: hidden;
            background: #fdfdfd;
        }
        /* Staff Lines Styling */
        #staff-box { 
            position: relative; width: 80%; height: 200px;
            display: flex; flex-direction: column; justify-content: space-between;
            padding: 40px 0; border-left: 2px solid #333; border-right: 2px solid #333;
        }
        .line { height: 2px; background: #333; width: 100%; }
        
        #clef-display { position: absolute; left: 10px; top: 70px; font-size: 60px; font-weight: bold; }
        #note-display { position: absolute; left: 40%; font-size: 50px; font-weight: bold; transition: all 0.1s; }
        
        #d-pad { 
            display: grid; grid-template-columns: repeat(3, 80px); 
            gap: 10px; padding-bottom: 20px; 
        }
        button { 
            height: 80px; font-size: 16px; border-radius: 12px; 
            border: 2px solid #ccc; background: #fff; 
        }
    </style>
</head>
<body>

    <div id="staff-box">
        <div class="line"></div><div class="line"></div><div class="line"></div><div class="line"></div><div class="line"></div>
        <div id="clef-display">T</div>
        <div id="note-display">C4</div>
    </div>

    <div id="d-pad">
        <div></div><button data-dir="up">UP</button><div></div>
        <button data-dir="left">LEFT</button><div></div><button data-dir="right">RIGHT</button>
        <div></div><button data-dir="down">DOWN</button><div></div>
    </div>

    <script>
        let pitch = 60; 
        const chakraColors = ["#FF0000", "#FF7F00", "#FFFF00", "#00FF00", "#0000FF", "#4B0082", "#9400D3"];

        function update() {
            const clefEl = document.getElementById('clef-display');
            const noteEl = document.getElementById('note-display');
            
            // Logic: Switch Clef
            clefEl.textContent = (pitch < 60) ? 'B' : 'T';
            
            // Logic: Name
            const noteNames = ["C", "C#", "D", "D#", "E", "F", "F#", "G", "G#", "A", "A#", "B"];
            noteEl.textContent = `${noteNames[pitch % 12]}${Math.floor(pitch / 12) - 1}`;
            
            // Logic: Color
            noteEl.style.color = chakraColors[pitch % 7];
            
            // Logic: Vertical Position (Move the note up/down based on pitch)
            // We adjust the top margin based on the pitch
            const offset = (72 - pitch) * 8; 
            noteEl.style.top = `${offset}px`;
        }

        document.querySelectorAll('button').forEach(btn => {
            btn.addEventListener('pointerdown', (e) => {
                const dir = e.target.dataset.dir;
                if(dir === 'up') pitch++;
                if(dir === 'down') pitch--;
                update();
            });
        });

        update();
    </script>
</body>
</html>
