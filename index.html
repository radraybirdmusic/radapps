<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CRi1 Music Learner</title>
    <style>
        * { box-sizing: border-box; }
        body { 
            margin: 0; height: 100vh; display: flex; flex-direction: column; 
            align-items: center; justify-content: space-between; 
            font-family: sans-serif; touch-action: none; overflow: hidden;
            background: #f0f0f0;
        }
        #display-area { 
            flex: 1; display: flex; flex-direction: column; 
            justify-content: center; align-items: center; 
        }
        #clef { font-size: 80px; font-weight: bold; color: #333; }
        #note-label { font-size: 60px; margin-top: 10px; font-weight: bold; }
        
        #d-pad { 
            display: grid; grid-template-columns: repeat(3, 80px); 
            gap: 10px; padding-bottom: 20px; 
        }
        button { 
            height: 80px; font-size: 16px; border-radius: 12px; 
            border: 2px solid #ccc; background: #fff; touch-action: manipulation;
        }
    </style>
</head>
<body>

    <div id="display-area">
        <div id="clef">T</div>
        <div id="note-label">C4</div>
    </div>

    <div id="d-pad">
        <div></div><button data-dir="up">UP</button><div></div>
        <button data-dir="left">LEFT</button><div></div><button data-dir="right">RIGHT</button>
        <div></div><button data-dir="down">DOWN</button><div></div>
    </div>

    <script>
        let pitch = 60; 
        const chakraColors = ["#FF0000", "#FF7F00", "#FFFF00", "#00FF00", "#0000FF", "#4B0082", "#9400D3"];

        function update() {
            const clefEl = document.getElementById('clef');
            const noteEl = document.getElementById('note-label');
            
            clefEl.textContent = (pitch < 60) ? 'B' : 'T';
            
            const noteNames = ["C", "C#", "D", "D#", "E", "F", "F#", "G", "G#", "A", "A#", "B"];
            const name = noteNames[pitch % 12];
            const octave = Math.floor(pitch / 12) - 1;
            
            noteEl.textContent = `${name}${octave}`;
            noteEl.style.color = chakraColors[pitch % 7];
        }

        document.querySelectorAll('button').forEach(btn => {
            btn.addEventListener('pointerdown', (e) => {
                const dir = e.target.dataset.dir;
                if(dir === 'up') pitch++;
                if(dir === 'down') pitch--;
                update();
            });
        });

        update();
    </script>
</body>
</html>
