<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CRi1 Music Learner</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { height: 100vh; background: #fff; overflow: hidden; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; }
        
        /* 
           - Fixed buffer: Padding-top ensures the 2-segment gap at the top.
           - Staff lines: 5 lines, 30px spacing.
        */
        #staff-canvas { 
            margin-top: 60px; width: 90%; height: 122px; 
            background-image: repeating-linear-gradient(to bottom, #000, #000 2px, transparent 2px, transparent 30px);
            position: relative;
        }
        #note-head { position: absolute; left: 45%; font-size: 25px; transition: top 0.1s; transform: translate(-50%, -50%); }

        #controls { margin-top: 40px; display: flex; align-items: center; gap: 15px; }
        #d-pad { display: grid; grid-template-columns: 50px 50px 50px; gap: 5px; align-items: center; justify-items: center; }
        .label-container { width: 50px; text-align: center; font-size: 20px; font-weight: bold; }
        button { height: 50px; width: 50px; border-radius: 8px; border: 1px solid #333; background: #eee; }
    </style>
</head>
<body>

    <div id="staff-canvas"><div id="note-head">●</div></div>

    <div id="controls">
        <div style="font-weight:bold; font-size: 24px; color: #ccc;">B</div>
        <div id="d-pad">
            <div></div><button data-dir="up">^</button><div></div>
            <button data-dir="left"><</button>
            <div id="note-label" class="label-container">C4</div>
            <button data-dir="right">></button>
            <div></div><button data-dir="down">v</button><div></div>
        </div>
        <div style="font-weight:bold; font-size: 24px;">T</div>
    </div>

    <script>
        // Mapping based on your specific requirements:
        // C4 = One line distance below bottom staff line
        // D4 = Half line distance below bottom staff line
        // E4 = On the first (bottom) line
        const scale = [
            {name: "C4", top: 150}, {name: "D4", top: 135}, {name: "E4", top: 120}, {name: "F4", top: 105}, 
            {name: "G4", top: 90}, {name: "A4", top: 75}, {name: "B4", top: 60}, {name: "C5", top: 45}, 
            {name: "D5", top: 30}, {name: "E5", top: 15}, {name: "F5", top: 0}, {name: "G5", top: -15}, {name: "A5", top: -30}
        ];
        const chakraColors = ["#FF0000", "#FF7F00", "#FFFF00", "#00FF00", "#0000FF", "#4B0082", "#9400D3"];
        let idx = 0; 
        
        function update() {
            const label = document.getElementById('note-label');
            label.textContent = scale[idx].name;
            label.style.color = chakraColors[idx % 7];
            const head = document.getElementById('note-head');
            head.style.color = chakraColors[idx % 7];
            head.style.top = scale[idx].top + 'px';
        }

        document.querySelectorAll('button').forEach(b => {
            b.addEventListener('pointerdown', (e) => {
                const dir = e.target.dataset.dir;
                if(dir === 'up') idx = Math.min(idx + 1, scale.length - 1);
                if(dir === 'down') idx = Math.max(idx - 1, 0);
                update();
            });
        });
        update();
    </script>
</body>
</html>
