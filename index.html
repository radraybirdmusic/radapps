<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CRi1 Music Learner</title>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; height: 100vh; display: flex; flex-direction: column; align-items: center; background: #fff; overflow: hidden; font-family: sans-serif; touch-action: none; }
        
        #staff-area { flex: 1; width: 95%; border: 2px solid #000; margin: 5px; position: relative; background: linear-gradient(to bottom, #333 2px, transparent 2px) 0 30px / 100% 30px; }
        #note-label { position: absolute; left: 50%; font-size: 24px; font-weight: bold; transition: all 0.1s; padding: 2px; }
        
        #controls { display: flex; align-items: center; gap: 10px; margin: 5px; }
        #clef-indicator { font-size: 24px; font-weight: bold; }
        #d-pad { display: grid; grid-template-columns: repeat(3, 50px); gap: 5px; }
        button { height: 50px; border-radius: 5px; border: 1px solid #333; }
        
        #keyboard { display: flex; width: 100%; height: 80px; }
        .key { flex: 1; border: 1px solid #000; }
        .black { background: #000; width: 2%; z-index: 10; }
        .white { background: #fff; }
    </style>
</head>
<body>

    <div id="staff-area">
        <div id="note-label">C4</div>
    </div>

    <div id="controls">
        <div id="clef-indicator">B</div>
        <div id="d-pad">
            <div></div><button data-dir="up">^</button><div></div>
            <button data-dir="left"><</button><div></div><button data-dir="right">></button>
            <div></div><button data-dir="down">v</button><div></div>
        </div>
        <div id="clef-indicator">T</div>
    </div>

    <div id="keyboard"></div>

    <script>
        let pitch = 60; // Middle C
        const chakraColors = ["#FF0000", "#FF7F00", "#FFFF00", "#00FF00", "#0000FF", "#4B0082", "#9400D3"];
        
        // Draw 49 Keys
        const kb = document.getElementById('keyboard');
        for(let i = 0; i < 49; i++) {
            let k = document.createElement('div');
            k.className = 'key ' + ([1,3,6,8,10].includes(i % 12) ? 'black' : 'white');
            k.id = 'k-' + i;
            kb.appendChild(k);
        }

        function update() {
            // Fix Note Label Logic
            const noteNames = ["C", "C#", "D", "D#", "E", "F", "F#", "G", "G#", "A", "A#", "B"];
            const octave = Math.floor(pitch / 12) - 1;
            const noteLabel = document.getElementById('note-label');
            
            noteLabel.textContent = noteNames[pitch % 12] + octave;
            noteLabel.style.color = chakraColors[pitch % 7];
            
            // Vertical Staff Position
            noteLabel.style.top = (100 - (pitch - 60) * 10) + 'px';
            
            // Keyboard visual feedback
            document.querySelectorAll('.key').forEach((el, idx) => {
                el.style.background = (idx === (pitch - 36)) ? 'red' : (el.classList.contains('black') ? 'black' : 'white');
            });
        }

        document.querySelectorAll('button').forEach(b => {
            b.addEventListener('pointerdown', (e) => {
                const dir = e.target.dataset.dir;
                if(dir === 'up') pitch++;
                if(dir === 'down') pitch--;
                update();
            });
        });
        update();
    </script>
</body>
</html>
