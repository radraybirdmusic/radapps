<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CRi1 Music Learner</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { height: 100vh; background: #fff; overflow: hidden; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; }
        #audio-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: #fff; z-index: 100; display: flex; justify-content: center; align-items: center; }
        #top-gap { height: 60px; width: 100%; }
        #staff-canvas { width: 90%; height: 122px; background-image: repeating-linear-gradient(to bottom, #000, #000 2px, transparent 2px, transparent 30px); position: relative; }
        #note-head { position: absolute; left: 45%; font-size: 25px; transition: top 0.1s; transform: translate(-50%, -50%); }
        #controls { margin-top: 40px; display: flex; align-items: center; gap: 15px; }
        #d-pad { display: grid; grid-template-columns: 50px 50px 50px; gap: 5px; align-items: center; justify-items: center; }
        .label-container { width: 50px; text-align: center; font-size: 20px; font-weight: bold; }
        button { height: 50px; width: 50px; border-radius: 8px; border: 1px solid #333; background: #eee; }
        .clef-lit { font-weight: bold; font-size: 24px; color: #000; }
        .clef-unlit { font-weight: bold; font-size: 24px; color: #ccc; }
    </style>
</head>
<body>

    <div id="audio-overlay"><button id="start-btn" style="width: 150px; height: 50px; font-size: 18px;">Start App</button></div>
    <div id="top-gap"></div>
    <div id="staff-canvas"><div id="note-head">●</div></div>

    <div id="controls">
        <div id="clef-b" class="clef-unlit">B</div>
        <div id="d-pad">
            <div></div><button data-dir="up">^</button><div></div>
            <button data-dir="left"><</button>
            <div id="note-label" class="label-container">C4</div>
            <button data-dir="right">></button>
            <div></div><button data-dir="down">v</button><div></div>
        </div>
        <div id="clef-t" class="clef-lit">T</div>
    </div>

    <script>
        const trebleScale = [
            {name: "C4", top: 150, freq: 261.63}, {name: "D4", top: 135, freq: 293.66}, {name: "E4", top: 120, freq: 329.63}, 
            {name: "F4", top: 105, freq: 349.23}, {name: "G4", top: 90, freq: 392.00}, {name: "A4", top: 75, freq: 440.00}, 
            {name: "B4", top: 60, freq: 493.88}, {name: "C5", top: 45, freq: 523.25}, {name: "D5", top: 30, freq: 587.33}, 
            {name: "E5", top: 15, freq: 659.25}, {name: "F5", top: 0, freq: 698.46}, {name: "G5", top: -15, freq: 783.99}, 
            {name: "A5", top: -30, freq: 880.00}
        ];
        
        const bassScale = [
            {name: "C4", top: -30, freq: 261.63}, {name: "B3", top: -15, freq: 246.94}, {name: "A3", top: 0, freq: 220.00}, 
            {name: "G3", top: 15, freq: 196.00}, {name: "F3", top: 30, freq: 174.61}, {name: "E3", top: 45, freq: 164.81}, 
            {name: "D3", top: 60, freq: 146.83}, {name: "C3", top: 75, freq: 130.81}, {name: "B2", top: 90, freq: 123.47}, 
            {name: "A2", top: 105, freq: 110.00}, {name: "G2", top: 120, freq: 98.00}, {name: "F2", top: 135, freq: 87.31}, 
            {name: "E2", top: 150, freq: 82.41}
        ];

        const chakraColors = ["#FF0000", "#FF7F00", "#FFFF00", "#00FF00", "#0000FF", "#4B0082", "#9400D3"];
        let audioCtx;
        
        document.getElementById('start-btn').addEventListener('click', () => {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            audioCtx.resume();
            document.getElementById('audio-overlay').style.display = 'none';
        });

        function playTone(freq) {
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.frequency.value = freq;
            gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.2);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.2);
        }
        
        let mode = "treble";
        let idx = 0; 
        
        function update(playSound = false) {
            const scale = (mode === "treble") ? trebleScale : bassScale;
            const label = document.getElementById('note-label');
            label.textContent = scale[idx].name;
            label.style.color = chakraColors[idx % 7];
            const head = document.getElementById('note-head');
            head.style.color = chakraColors[idx % 7];
            head.style.top = scale[idx].top + 'px';
            document.getElementById('clef-t').className = (mode === "treble") ? "clef-lit" : "clef-unlit";
            document.getElementById('clef-b').className = (mode === "bass") ? "clef-lit" : "clef-unlit";
            if (playSound) playTone(scale[idx].freq);
        }

        document.querySelectorAll('button').forEach(b => {
            b.addEventListener('pointerdown', (e) => {
                const dir = e.target.dataset.dir;
                if (mode === "treble") {
                    if (dir === 'up') idx = Math.min(idx + 1, trebleScale.length - 1);
                    else if (dir === 'down') {
                        if (idx === 0) { mode = "bass"; idx = 0; }
                        else idx = Math.max(idx - 1, 0);
                    }
                } else {
                    if (dir === 'up') {
                        if (idx === 0) { mode = "treble"; idx = 0; }
                        else idx = Math.max(idx - 1, 0);
                    } else if (dir === 'down') {
                        idx = Math.min(idx + 1, bassScale.length - 1);
                    }
                }
                update(true);
            });
        });
        update();
    </script>
</body>
</html>
