<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CRi1 Music Learner</title>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; height: 100vh; display: flex; flex-direction: column; align-items: center; background: #fff; overflow: hidden; font-family: sans-serif; touch-action: none; }
        
        /* 5-line Staff Area - Locked height */
        #staff-area { width: 90%; height: 160px; margin-top: 20px; border-left: 3px solid #000; border-right: 3px solid #000; 
            background-image: repeating-linear-gradient(to bottom, #000, #000 2px, transparent 2px, transparent 30px);
            background-position: 0 20px; border-bottom: 2px solid #000; position: relative; }
        
        /* Note placement: fixed circle */
        #note-head { position: absolute; left: 45%; font-size: 20px; transition: top 0.1s; }

        /* Controls Section - Perfectly Centered */
        #controls { display: flex; align-items: center; justify-content: center; gap: 10px; margin: 15px 0; }
        #clef-label { font-size: 24px; font-weight: bold; width: 30px; text-align: center; }
        #d-pad-container { display: flex; flex-direction: column; align-items: center; gap: 5px; }
        #note-label { font-size: 22px; font-weight: bold; }
        #d-pad { display: grid; grid-template-columns: repeat(3, 50px); gap: 5px; }
        button { height: 50px; border-radius: 8px; border: 1px solid #333; background: #eee; }

        /* Keyboard */
        #keyboard { display: flex; width: 100%; height: 80px; }
        .key { flex: 1; border: 1px solid #000; }
        .black { background: #000; width: 2%; z-index: 10; }
        .white { background: #fff; }
    </style>
</head>
<body>

    <div id="staff-area">
        <div id="note-head">●</div>
    </div>

    <div id="controls">
        <div id="clef-label">B</div>
        <div id="d-pad-container">
            <div id="d-pad">
                <div></div><button data-dir="up">^</button><div></div>
                <button data-dir="left"><</button><div id="note-label">A3</div><button data-dir="right">></button>
                <div></div><button data-dir="down">v</button><div></div>
            </div>
        </div>
        <div id="clef-label">T</div>
    </div>

    <div id="keyboard"></div>

    <script>
        let pitch = 57; // A3
        const chakraColors = ["#FF0000", "#FF7F00", "#FFFF00", "#00FF00", "#0000FF", "#4B0082", "#9400D3"];
        
        const kb = document.getElementById('keyboard');
        for(let i = 0; i < 49; i++) {
            let k = document.createElement('div');
            k.className = 'key ' + ([1,3,6,8,10].includes(i % 12) ? 'black' : 'white');
            k.id = 'k-' + i;
            kb.appendChild(k);
        }

        function update() {
            const noteNames = ["C", "C#", "D", "D#", "E", "F", "F#", "G", "G#", "A", "A#", "B"];
            const color = chakraColors[pitch % 7];
            const name = noteNames[pitch % 12] + (Math.floor(pitch / 12) - 1);
            
            // Sync Label
            const label = document.getElementById('note-label');
            label.textContent = name;
            label.style.color = color;
            
            // Sync Note Head
            const head = document.getElementById('note-head');
            head.style.color = color;
            // Snap logic: (pitch offset * 15px) ensures it hits lines/spaces correctly
            head.style.top = (110 - (pitch - 60) * 15) + 'px';
            
            // Sync Keyboard
            document.querySelectorAll('.key').forEach((el, idx) => {
                el.style.backgroundColor = (idx === (pitch - 36)) ? color : (el.classList.contains('black') ? 'black' : 'white');
            });
        }

        document.querySelectorAll('button').forEach(b => {
            b.addEventListener('pointerdown', (e) => {
                const dir = e.target.dataset.dir;
                if(dir === 'up') pitch++;
                if(dir === 'down') pitch--;
                update();
            });
        });
        update();
    </script>
</body>
</html>
