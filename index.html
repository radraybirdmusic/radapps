<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TRUMPET GARDEN v2.32: BANSHEE / CROSS</title>
    <style>
        :root { --p: #9d00ff; --o: #FF4500; --g: #0f0; --y: #ffcc00; --gry: #888; }
        body { margin: 0; background: #000; color: #fff; font-family: 'Courier New', monospace; overflow: hidden; touch-action: none; width: 100vw; height: 100vh; }
        .fae { filter: invert(1) hue-rotate(180deg); background: #fff !important; }
        #gate { position: fixed; inset: 0; background: #000; z-index: 2000; display: flex; justify-content: center; align-items: center; }
        #ui { position: absolute; inset: 0; z-index: 100; display: none; background: #000; }
        #header { position: absolute; top: 0; width: 100%; height: 115px; background: rgba(20,20,20,0.95); border-bottom: 2px solid #333; z-index: 1500; display: flex; flex-direction: column; align-items: center; }
        #rec-progress { position: absolute; bottom: 0; left: 0; height: 4px; background: var(--g); width: 0%; transition: width 0.1s linear; }
        .nav-container { display: flex; align-items: center; justify-content: space-around; width: 98%; height: 85px; margin-top: 5px; }
        .btn { background: #111; border: 2px solid var(--p); color: #fff !important; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 10px; text-align: center; height: 38px; width: 68px; }
        .mini-btn { width: 45px; height: 45px; border-radius: 50%; background: #111; border: 2px solid #fff; color: #fff !important; display: flex; align-items: center; justify-content: center; font-size: 22px; cursor: pointer; }
        .col-btn { display: flex; flex-direction: column; gap: 4px; }
        .mini-label { font-size: 8px; width: 52px; height: 18px; }
        #diag { width: 100%; text-align: center; font-size: 10px; color: var(--g); font-weight: bold; text-transform: uppercase; margin-top: 2px; }
        .ham { position: absolute; top: 125px; padding: 8px 15px; font-size: 10px; border: 2px solid var(--y); color: var(--y); background: #000; border-radius: 4px; z-index: 1000; cursor: pointer; }
        .sld { position: absolute; width: 45px; height: 200px; background: #111; border: 2px solid #555; border-radius: 22px; top: 220px; z-index: 300; }
        #l-s { left: 4%; } #r-s { right: 4%; }
        .fill { width: 100%; position: absolute; bottom: 0; background: linear-gradient(to top, var(--o), #fff); border-radius: 20px; pointer-events: none; }
        .pad-grid { position: absolute; bottom: 20px; width: 42%; height: auto; z-index: 400; cursor: pointer; pointer-events: all; }
        #pad-left { left: 6%; } #pad-right { right: 6%; }
        #osc { position: absolute; inset: 0; z-index: 10; pointer-events: none; }
    </style>
</head>
<body>
<div id="gate"><button id="b-mic" class="btn" style="font-size: 18px; width:220px; height:70px;">IGNITE BANSHEE</button></div>
<div id="ui">
    <div id="header">
        <div id="rec-progress"></div>
        <div class="nav-container">
            <div style="display:flex; align-items:center; gap:8px;">
                <button id="b-rec" class="mini-btn">🐝</button>
                <div class="col-btn">
                    <button id="p-rec-play" class="btn mini-label" style="border-color:var(--y); color:var(--y);">PLAY</button>
                    <button id="s-rec-stop" class="btn mini-label" style="border-color:var(--y); color:var(--y);">STOP</button>
                </div>
            </div>
            <div style="display:flex; align-items:center; gap:6px;">
                <button id="p-lock" class="btn" onclick="toggleLock()">LOCK</button>
                <button id="b-save" class="btn" style="border-color:#44aaff; color:#44aaff;">SAVE</button>
                <button id="b-glitch" class="btn" style="border-color:#ff4444; color:#ff4444;">GLITCH</button>
            </div>
            <div style="display:flex; align-items:center; gap:8px;">
                <div class="col-btn">
                    <button id="p-file-play" class="btn mini-label" style="border-color:var(--gry); color:var(--gry);">PLAY</button>
                    <button id="s-file-stop" class="btn mini-label" style="border-color:var(--gry); color:var(--gry);">STOP</button>
                </div>
                <button id="b-file" class="mini-btn">📂</button>
            </div>
        </div>
        <div id="diag">STATUS: INDUCTION DISCHARGE ACTIVE</div>
        <input type="file" id="f-in" hidden accept="audio/*">
    </div>

    <button id="h-left" class="ham" style="left: 8%;" onpointerdown="hamMomentum(0.94)">HAM L-</button>
    <button id="h-right" class="ham" style="right: 8%;" onpointerdown="hamMomentum(1.06)">HAM R+</button>

    <div id="l-s" class="sld" onpointerdown="slide(event,'l')" onpointermove="slide(event,'l')"><div id="l-f" class="fill" style="height:50%"></div></div>
    <div id="r-s" class="sld" onpointerdown="slide(event,'r')" onpointermove="slide(event,'r')"><div id="r-f" class="fill" style="height:50%"></div></div>

    <svg id="pad-left" class="pad-grid" viewBox="0 0 220 230">
        <g stroke="#fff" stroke-width="2.5" fill="none" pointer-events="all">
            <circle cx="40" cy="40" r="25" onpointerdown="pulse(1.0)"/><circle cx="110" cy="40" r="25" onpointerdown="pulse(1.1)"/><circle cx="180" cy="40" r="25" onpointerdown="pulse(1.2)"/>
            <circle cx="40" cy="110" r="25" onpointerdown="pulse(0.8)"/><circle cx="110" cy="110" r="25" onpointerdown="pulse(0.9)"/><circle cx="180" cy="110" r="25" onpointerdown="pulse(1.0)"/>
            <circle cx="40" cy="180" r="25" onpointerdown="pulse(0.6)"/><circle cx="110" cy="180" r="25" onpointerdown="pulse(0.7)"/><circle cx="180" cy="180" r="25" onpointerdown="pulse(0.8)"/>
        </g>
    </svg>

    <svg id="pad-right" class="pad-grid" viewBox="0 0 220 230">
        <g stroke="#fff" stroke-width="2.5" fill="none" pointer-events="all">
            <circle cx="40" cy="40" r="25" onpointerdown="pulse(1.2)"/><circle cx="110" cy="40" r="25" onpointerdown="pulse(1.1)"/><circle cx="180" cy="40" r="25" onpointerdown="pulse(1.0)"/>
            <circle cx="40" cy="110" r="25" onpointerdown="pulse(1.0)"/><circle cx="110" cy="110" r="25" onpointerdown="pulse(0.9)"/><circle cx="180" cy="110" r="25" onpointerdown="pulse(0.8)"/>
            <circle cx="40" cy="180" r="25" onpointerdown="pulse(0.8)"/><circle cx="110" cy="180" r="25" onpointerdown="pulse(0.7)"/><circle cx="180" cy="180" r="25" onpointerdown="pulse(0.6)"/>
        </g>
    </svg>
</div>
<canvas id="osc"></canvas>

<script>
let aCtx, anal, src, rec, chks = [], virtualCache = null, isL = false, isF = false, ints = {l:0.5, r:0.5}, activeSources = [], currentPitch = 1.0;
const cvs = document.getElementById('osc'), ctx = cvs.getContext('2d'), diag = document.getElementById('diag'), prog = document.getElementById('rec-progress');

document.getElementById('b-mic').onclick = async () => {
    document.getElementById('gate').style.display = 'none'; 
    document.getElementById('ui').style.display = 'block';
    try {
        aCtx = new (window.AudioContext || window.webkitAudioContext)();
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        src = aCtx.createMediaStreamSource(stream);
        anal = aCtx.createAnalyser(); 
        anal.fftSize = 2048;
        src.connect(anal); 
        draw(); 
    } catch (err) { diag.innerText = "INDUCTION OFFLINE"; }
};

document.getElementById('b-rec').onclick = () => {
    if (rec && rec.state === "recording") return;
    chks = []; 
    rec = new MediaRecorder(src.mediaStream);
    rec.ondataavailable = e => chks.push(e.data);
    rec.onstop = () => {
        const b = new Blob(chks, { type: 'audio/webm' });
        const r = new FileReader();
        r.onloadend = () => { 
            virtualCache = r.result; 
            diag.innerText = `BUCKET CHARGED: ${virtualCache.length} CHR`; 
        };
        r.readAsDataURL(b);
        currentPitch = 1.0;
    };
    rec.start();
    let s = Date.now();
    let i = setInterval(() => {
        let e = Date.now() - s;
        prog.style.width = Math.min((e / 3500) * 100, 100) + '%';
        if (e >= 3500) { clearInterval(i); if(rec.state === "recording") rec.stop(); }
    }, 50);
};

async function hamMomentum(multiplier) {
    if (!virtualCache) return;
    currentPitch *= multiplier;
    diag.innerText = `RESONANCE: ${currentPitch.toFixed(2)}x`;
    pulse(1.0);
}

async function pulse(p) {
    if (!virtualCache || !aCtx) return;
    if (aCtx.state === 'suspended') await aCtx.resume();
    const res = await fetch(virtualCache);
    const ab = await res.arrayBuffer();
    aCtx.decodeAudioData(ab, (buffer) => {
        // Preset: Auto-strip silence at start for tighter response
        let offset = 0; const d = buffer.getChannelData(0);
        for(let i=0; i<d.length; i++) { if(Math.abs(d[i]) > 0.01) { offset = i / buffer.sampleRate; break; } }
        
        const s = aCtx.createBufferSource(); 
        s.buffer = buffer; 
        s.playbackRate.value = p * currentPitch;
        s.connect(anal); 
        anal.connect(aCtx.destination); 
        s.start(0, offset);
        activeSources.push(s); 
    });
}

function slide(e, s) {
    if (isL || (e.buttons !== 1 && !e.touches)) return;
    const r = e.currentTarget.getBoundingClientRect();
    const y = e.touches ? e.touches[0].clientY : e.clientY;
    let v = 1 - (y - r.top) / r.height;
    ints[s] = Math.max(0, Math.min(1.5, v * 1.5));
    document.getElementById(s + '-f').style.height = (ints[s] / 1.5) * 100 + "%";
    isF = (ints.l > 1.0 || ints.r > 1.0);
    document.body.classList.toggle('fae', isF);
}

document.getElementById('b-file').onclick = () => document.getElementById('f-in').click();
document.getElementById('f-in').onchange = (e) => {
    const r = new FileReader(); r.onload = (re) => { virtualCache = re.target.result; diag.innerText = "📂 LOADED"; };
    r.readAsDataURL(e.target.files[0]);
};

document.getElementById('p-file-play').onclick = () => { currentPitch = 1.0; pulse(1.0); };
document.getElementById('p-rec-play').onclick = () => { currentPitch = 1.0; pulse(1.0); };
document.getElementById('s-file-stop').onclick = () => stopAll();
document.getElementById('s-rec-stop').onclick = () => stopAll();

function stopAll() { activeSources.forEach(s => { try { s.stop(); } catch(err) {} }); activeSources = []; }
function toggleLock() { isL = !isL; document.getElementById('p-lock').innerText = isL ? "LOCKED" : "LOCK"; }

function draw() {
    requestAnimationFrame(draw); if (!anal) return;
    cvs.width = window.innerWidth; cvs.height = window.innerHeight;
    const d = new Uint8Array(anal.frequencyBinCount); 
    anal.getByteTimeDomainData(d);
    ctx.clearRect(0, 0, cvs.width, cvs.height); 
    ctx.lineWidth = 4; 
    ctx.strokeStyle = isF ? "#000" : "#9d00ff";
    ctx.beginPath(); 
    let sw = cvs.width / d.length;
    for (let i = 0; i < d.length; i++) {
        const y = (d[i] / 128.0) * cvs.height / 2;
        if (i === 0) ctx.moveTo(i * sw, y); else ctx.lineTo(i * sw, y);
    }
    ctx.stroke();
}
</script>
</body>
</html>
