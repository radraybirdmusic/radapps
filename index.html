<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CRi1 Music Staff</title>
    <style>
        * { box-sizing: border-box; }
        body { 
            margin: 0; height: 100vh; display: flex; flex-direction: column; 
            align-items: center; justify-content: space-between; 
            font-family: sans-serif; touch-action: none; overflow: hidden;
            background: #ffffff;
        }
        
        #staff-container { 
            position: relative; width: 90%; height: 200px;
            margin-top: 60px; border-left: 4px solid #333; border-right: 4px solid #333;
            /* Reduced gap from 50px to 30px to fit ledger lines */
            background-image: linear-gradient(to bottom, #333 2px, transparent 2px);
            background-size: 100% 30px;
            background-position: 0 40px;
        }
        
        #clef-display { position: absolute; left: 10px; top: 55px; font-size: 50px; font-weight: bold; }
        #note-display { 
            position: absolute; left: 45%; font-size: 35px; font-weight: bold; 
            transition: top 0.1s; background: white; padding: 0 5px; 
        }
        
        #d-pad { display: grid; grid-template-columns: repeat(3, 80px); gap: 10px; padding-bottom: 40px; }
        button { height: 70px; font-size: 16px; border-radius: 10px; border: 2px solid #333; background: #eee; }
    </style>
</head>
<body>

    <div id="staff-container">
        <div id="clef-display">T</div>
        <div id="note-display">C4</div>
    </div>

    <div id="d-pad">
        <div></div><button data-dir="up">UP</button><div></div>
        <button data-dir="left">LEFT</button><div></div><button data-dir="right">RIGHT</button>
        <div></div><button data-dir="down">DOWN</button><div></div>
    </div>

    <script>
        let pitch = 60; 
        const chakraColors = ["#FF0000", "#FF7F00", "#FFFF00", "#00FF00", "#0000FF", "#4B0082", "#9400D3"];

        function update() {
            const clefEl = document.getElementById('clef-display');
            const noteEl = document.getElementById('note-display');
            
            clefEl.textContent = (pitch < 60) ? 'B' : 'T';
            
            const noteNames = ["C", "C#", "D", "D#", "E", "F", "F#", "G", "G#", "A", "A#", "B"];
            noteEl.textContent = `${noteNames[pitch % 12]}${Math.floor(pitch / 12) - 1}`;
            noteEl.style.color = chakraColors[pitch % 7];
            
            // Adjusted mapping: tighter scaling factor (15px per step) to fit the staff
            const topPos = 140 - ((pitch - 60) * 15);
            noteEl.style.top = `${topPos}px`;
        }

        document.querySelectorAll('button').forEach(btn => {
            btn.addEventListener('pointerdown', (e) => {
                const dir = e.target.dataset.dir;
                if(dir === 'up') pitch++;
                if(dir === 'down') pitch--;
                update();
            });
        });

        update();
    </script>
</body>
</html>
