<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>TACO CITY BOARD OF TOURISM - v1.3</title>
    <style>
        body {
            background-color: #050505;
            color: #00ff41;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
            transition: background-color 0.2s;
        }

        /* CRT Scanline Effect */
        body::before {
            content: " ";
            display: block;
            position: absolute;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), 
                        linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            z-index: 10;
            background-size: 100% 4px, 3px 100%;
            pointer-events: none;
        }

        #terminal {
            width: 80%;
            max-width: 800px;
            height: 400px;
            border: 2px solid #003300;
            padding: 20px;
            background: #000;
            box-shadow: 0 0 20px rgba(0, 255, 65, 0.2);
            position: relative;
            z-index: 5;
            overflow: hidden;
        }

        .input-line { display: flex; align-items: center; }
        input {
            background: transparent;
            border: none;
            color: #00ff41;
            font-family: inherit;
            font-size: 1.2rem;
            outline: none;
            width: 100%;
        }

        canvas {
            display: none;
            border: 4px solid #333;
            image-rendering: pixelated;
            background: #000;
            position: relative;
            z-index: 5;
        }

        /* Glitch Animation */
        @keyframes shake {
            0% { transform: translate(2px, 1px) rotate(0deg); }
            20% { transform: translate(-3px, -2px) rotate(-1deg); }
            40% { transform: translate(3px, 2px) rotate(1deg); }
            60% { transform: translate(-3px, 1px) rotate(-1deg); }
            80% { transform: translate(2px, -2px) rotate(1deg); }
            100% { transform: translate(1px, 2px) rotate(0deg); }
        }

        .glitch-active { animation: shake 0.1s infinite; color: #d000ff !important; }
    </style>
</head>
<body>

    <div id="terminal">
        <div id="output">
            TACO CITY BOARD OF TOURISM - SYSTEM v1.2 [STABLE]<br>
            --------------------------------------------------<br>
            PLEASE ENTER ACCESS CODE:<br>
        </div>
        <div class="input-line">
            <span>>&nbsp;</span><input type="text" id="commandInput" autofocus autocomplete="off">
        </div>
    </div>

    <canvas id="gameCanvas" width="512" height="448"></canvas>

    <script>
        const input = document.getElementById('commandInput');
        const output = document.getElementById('output');
        const term = document.getElementById('terminal');
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        input.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                const cmd = input.value.toLowerCase().trim();
                handleCommand(cmd);
                input.value = '';
            }
        });

        function handleCommand(cmd) {
            if (cmd === 'start') {
                startIntro();
            } else if (cmd === 'start -nointro') {
                skipToIntro();
            } else if (cmd === 'slimey') {
                triggerMotherGlitch();
            } else {
                output.innerHTML += `<div>>> UNKNOWN CODE: ${cmd}</div>`;
            }
        }

        function triggerMotherGlitch() {
            const originalColor = document.body.style.backgroundColor;
            document.body.classList.add('glitch-active');
            document.body.style.backgroundColor = "#2a0035";
            output.innerHTML += `<div style="color:#d000ff">WARNING: PARASITIC SCOBY DETECTED...</div>`;
            output.innerHTML += `<div style="color:#d000ff">RE-ROUTING MAINFRAME...</div>`;
            
            setTimeout(() => {
                document.body.classList.remove('glitch-active');
                document.body.style.backgroundColor = "#050505";
                output.innerHTML += `<div>>> SYSTEM RESTORED. STANDBY.</div><br>`;
            }, 1500);
        }

        function startIntro() {
            term.style.display = 'none';
            canvas.style.display = 'block';
            runCinematic();
        }

        function skipToIntro() {
            term.style.display = 'none';
            canvas.style.display = 'block';
            drawFinalTitle();
        }

        async function runCinematic() {
            // Sequence 1: Entanglement Text
            const lines = ["MAINFRAME ENTANGLEMENT", "SLIMEY MOTHER DETECTED", "TELEPORTING..."];
            for(let line of lines) {
                ctx.fillStyle = "black";
                ctx.fillRect(0,0, canvas.width, canvas.height);
                ctx.fillStyle = "#d000ff";
                ctx.font = "20px monospace";
                ctx.textAlign = "center";
                ctx.fillText(line, canvas.width/2, canvas.height/2);
                await new Promise(r => setTimeout(r, 1000));
            }

            // Sequence 2: The CLEAN Title Zoom
            let size = 10;
            const titleInterval = setInterval(() => {
                // FIXED: We clear the rectangle EVERY frame now to prevent overlap
                ctx.fillStyle = "black";
                ctx.fillRect(0,0, canvas.width, canvas.height);
                
                ctx.fillStyle = "white";
                ctx.font = `${size}px monospace`;
                ctx.textAlign = "center";
                ctx.fillText("TACO CITY RAMPAGE", canvas.width/2, canvas.height/2);
                
                size += 4;
                if (size > 60) {
                    clearInterval(titleInterval);
                    setTimeout(drawFinalTitle, 500);
                }
            }, 50);
        }

        function drawFinalTitle() {
            ctx.fillStyle = "black";
            ctx.fillRect(0,0, canvas.width, canvas.height);
            
            // Ground/Blue Zone
            ctx.fillStyle = "#0055ff";
            ctx.fillRect(0, canvas.height - 120, canvas.width, 120);
            
            // Final Text
            ctx.fillStyle = "#ffcc00";
            ctx.font = "40px monospace";
            ctx.fillText("TACO CITY", canvas.width/2, canvas.height/2 - 20);
            
            ctx.fillStyle = "#d000ff";
            ctx.font = "50px monospace";
            ctx.fillText("RAMPAGE", canvas.width/2, canvas.height/2 + 50);
        }
    </script>
</body>
</html>
